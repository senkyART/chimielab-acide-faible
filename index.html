<!DOCTYPE html>
<!-- index.html — Interface simplifiée pour la résolution d'acide faible dans l'eau -->
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ChimieLab — Résolution Acide Faible dans l'Eau</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body>
  <div class="container">
    <!-- En-tête épuré -->
    <header>
      <div class="brand-title">
        <h1>ChimieLab — Acide Faible</h1>
        <p>Résolution d'exercices d'acide faible dans l'eau</p>
      </div>
    </header>

    <!-- 1. Sélecteur des 3 modes en une rangée -->
    <div class="modes-grid" role="tablist">
      <button type="button" class="mode-card active" id="card-mode-1" role="tab" aria-selected="true" data-mode="1">
        <span class="mode-title">Mode 1</span>
        <span class="mode-subtitle">C et pH</span>
      </button>
      <button type="button" class="mode-card" id="card-mode-2" role="tab" aria-selected="false" data-mode="2">
        <span class="mode-title">Mode 2</span>
        <span class="mode-subtitle">C et σ</span>
      </button>
      <button type="button" class="mode-card" id="card-mode-3" role="tab" aria-selected="false" data-mode="3">
        <span class="mode-title">Mode 3</span>
        <span class="mode-subtitle">C et K</span>
      </button>
    </div>

    <!-- 2. Panneau de saisie et bouton Calculer -->
    <section class="glass-panel">
      <div class="form-section-title">
        <span id="form-title">Paramètres — Mode 1</span>
      </div>

      <form id="calc-form">
        <div class="inputs-grid" id="inputs-container">
          <!-- Champs injectés dynamiquement par form.js -->
        </div>

        <div class="form-actions">
          <button type="submit" class="btn-primary" id="btn-calc">Calculer</button>
          <button type="button" class="btn-link" id="btn-reset">Réinitialiser</button>
        </div>
      </form>

      <!-- Message d'erreur (affiché sous le bouton après clic) -->
      <div class="error-box" id="error-box"></div>
    </section>

    <!-- 3. Résultats (visibles uniquement après clic sur Calculer ou Entrée) -->
    <section id="results-section" style="display: none;">
      <!-- Cartes synthétiques -->
      <div class="results-grid" id="results-grid"></div>

      <!-- Rédaction pas à pas d'examen -->
      <div class="solution-block">
        <h2 style="font-size: 1.05rem; font-weight: 700; margin-bottom: 12px; color: var(--text-main);">
          Rédaction Pas à Pas
        </h2>
        <div id="solution-steps-list"></div>

        <!-- Bouton Copier la solution sous la rédaction -->
        <div class="solution-actions">
          <button type="button" class="btn-secondary" id="btn-copy-solution">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
            Copier la solution
          </button>
        </div>
      </div>
    </section>

    <!-- Pied de page avec lien discret pour le testeur -->
    <footer class="site-footer">
      <button type="button" class="footer-link" id="btn-open-tester">Tester (suite de tests)</button>
    </footer>
  </div>

  <!-- Modale du Testeur Automatisé -->
  <div class="modal-overlay" id="tester-modal">
    <div class="modal-box">
      <div class="modal-header">
        <h2>Suite de Tests Automatisée</h2>
        <button type="button" class="btn-close" id="btn-close-tester">Fermer</button>
      </div>
      <p style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 12px;">
        Vérifications numériques réelles (tolérance relative 0,5 %, pH : 0,01).
      </p>
      <div id="tester-summary" style="font-weight: 600; font-size: 0.9rem; margin-bottom: 14px;"></div>
      <table class="test-table">
        <thead>
          <tr>
            <th>Test</th>
            <th>Attendu</th>
            <th>Obtenu</th>
            <th>Statut</th>
          </tr>
        </thead>
        <tbody id="test-results-tbody"></tbody>
      </table>
    </div>
  </div>

  <!-- Notification Toast -->
  <div class="toast" id="toast">Copié dans le presse-papiers !</div>

  <!-- Scripts JavaScript (chargés dans l'ordre strict prescrit) -->
  <script src="js/parser.js"></script>
  <script src="js/format.js"></script>
  <script src="js/units.js"></script>
  <script src="js/calc.js"></script>
  <script src="js/state.js"></script>
  <script src="js/clipboard.js"></script>
  <script src="js/solution.js"></script>
  <script src="js/form.js"></script>
  <script src="js/tester.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
